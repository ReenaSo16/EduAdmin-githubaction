
name: EduAdmin CI-CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduadmin-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0'
  API_DIR: StudentAPI/StudentAPI/StudentAPI
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # 1. API Build and Test
  api-build-test:
    name: "01 - API Build and Test"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dotnet"

          curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"

          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Restore
        working-directory: ${{ env.API_DIR }}
        run: dotnet restore StudentAPI.csproj

      - name: Build
        working-directory: ${{ env.API_DIR }}
        run: dotnet build StudentAPI.csproj -c Release --no-restore

      - name: Test
        working-directory: ${{ env.API_DIR }}
        run: dotnet test StudentAPI.csproj -c Release --no-build

      - name: Publish API
        working-directory: ${{ env.API_DIR }}
        run: |
          dotnet publish StudentAPI.csproj -c Release --no-build \
            -o "$RUNNER_TEMP/api-publish"

      - name: Upload API publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-api-publish
          path: ${{ runner.temp }}/api-publish/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup SDK
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dotnet"
          rm -f "$RUNNER_TEMP/dotnet-install.sh"


  # 2. Angular Frontend Build
  frontend-build:
    name: "02 - Angular Build"
    needs: api-build-test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: student-app
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund --progress=false

      - name: Build Angular
        working-directory: student-app
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-frontend-dist
          path: student-app/dist/student-app/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup npm files
        if: always()
        run: |
          rm -rf student-app/node_modules
          npm cache clean --force || true


  # 3. Build and Push API Image to Docker Hub
  api-image:
    name: "03 - Build and Push API Image"
    needs: frontend-build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API publish artifact
        uses: actions/download-artifact@v4
        with:
          name: eduadmin-api-publish
          path: docker-context/api/publish

      - name: Prepare API Docker context
        shell: bash
        run: |
          set -euo pipefail

          test -f "$API_DIR/Dockerfile"
          test -n "$(find docker-context/api/publish -type f -print -quit)"

          cp "$API_DIR/Dockerfile" docker-context/api/Dockerfile

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build API Image
        run: |
          set -euo pipefail

          docker build --pull \
            -t "$DOCKERHUB_USERNAME/eduadmin-api:$GITHUB_SHA" \
            docker-context/api

      - name: Push API Image
        run: |
          set -euo pipefail

          docker push "$DOCKERHUB_USERNAME/eduadmin-api:$GITHUB_SHA"

      - name: Cleanup API Docker Context
        if: always()
        run: |
          rm -rf docker-context/api
          docker logout || true


  # 4. Build and Push Frontend Image to Docker Hub
  frontend-image:
    name: "04 - Build and Push Frontend Image"
    needs: api-image
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: eduadmin-frontend-dist
          path: docker-context/frontend/dist

      - name: Prepare frontend Docker context
        shell: bash
        run: |
          set -euo pipefail

          test -f student-app/Dockerfile
          test -n "$(find docker-context/frontend/dist -type f -print -quit)"

          cp student-app/Dockerfile docker-context/frontend/Dockerfile

      - name: Copy Nginx Configuration
        shell: bash
        run: |
          set -euo pipefail
          cp student-app/nginx.conf docker-context/frontend/nginx.conf

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build Frontend Image
        run: |
          set -euo pipefail

          docker build --pull \
            -t "$DOCKERHUB_USERNAME/eduadmin-frontend:$GITHUB_SHA" \
            docker-context/frontend

      - name: Push Frontend Image
        run: |
          set -euo pipefail

          docker push "$DOCKERHUB_USERNAME/eduadmin-frontend:$GITHUB_SHA"

      - name: Cleanup Frontend Docker Context
        if: always()
        run: |
          rm -rf docker-context/frontend
          docker logout || true
