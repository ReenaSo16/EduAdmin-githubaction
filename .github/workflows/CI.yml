name: EduAdmin Staged CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduadmin-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '22'
  API_PROJECT: StudentAPI/StudentAPI/StudentAPI/StudentAPI.csproj
  API_DIR: StudentAPI/StudentAPI/StudentAPI

jobs:
  # 1. API build and tests
  api-build-test:
    name: "01 - API Build and Test"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Restore
        working-directory: ${{ env.API_DIR }}
        run: dotnet restore StudentAPI.csproj

      - name: Build
        working-directory: ${{ env.API_DIR }}
        run: dotnet build StudentAPI.csproj -c Release --no-restore

      - name: Test
        working-directory: ${{ env.API_DIR }}
        run: dotnet test StudentAPI.csproj -c Release --no-build

      - name: Publish API
        working-directory: ${{ env.API_DIR }}
        run: |
          dotnet publish StudentAPI.csproj -c Release --no-build \
            -o "$RUNNER_TEMP/api-publish"

      - name: Upload API publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-api-publish
          path: ${{ runner.temp }}/api-publish/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup SDK
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dotnet"
          rm -f "$RUNNER_TEMP/dotnet-install.sh"

  # 2. API SonarQube analysis
  api-sonarqube:
    name: "02 - API SonarQube"
    needs: api-build-test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Install SonarScanner
        run: |
          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/dotnet-tools"
          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"

      - name: Begin API analysis
        working-directory: ${{ env.API_DIR }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          set -e
          dotnet-sonarscanner begin \
            /k:"EduAdmin-API" \
            /n:"EduAdmin-API" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Restore for analysis
        working-directory: ${{ env.API_DIR }}
        run: dotnet restore StudentAPI.csproj

      - name: Build with Sonar analysis
        working-directory: ${{ env.API_DIR }}
        run: dotnet build StudentAPI.csproj -c Release --no-restore

      - name: Complete API analysis
        working-directory: ${{ env.API_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Cleanup scanner and SDK
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dotnet"
          rm -rf "$RUNNER_TEMP/dotnet-tools"
          rm -f "$RUNNER_TEMP/dotnet-install.sh"

  # 3. Frontend build
  frontend-build:
    name: "03 - Angular Build"
    needs: api-sonarqube
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: student-app
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund --progress=false

      - name: Build Angular
        working-directory: student-app
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-frontend-dist
          path: student-app/dist/student-app/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup npm files
        if: always()
        run: |
          rm -rf student-app/node_modules
          npm cache clean --force || true

  # 4. Frontend SonarQube analysis
  frontend-sonarqube:
    name: "04 - Frontend SonarQube"
    needs: frontend-build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SonarScanner CLI
        run: |
          set -e
          VERSION="7.1.0.4889"
          ARCHIVE="$RUNNER_TEMP/sonar-scanner.zip"
          EXTRACT_DIR="$RUNNER_TEMP/sonar-scanner-extract"

          mkdir -p "$EXTRACT_DIR"
          curl -fsSL --retry 3 \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${VERSION}-linux-x64.zip" \
            -o "$ARCHIVE"
          unzip -q -o "$ARCHIVE" -d "$EXTRACT_DIR"
          echo "$EXTRACT_DIR/sonar-scanner-${VERSION}-linux-x64/bin" \
            >> "$GITHUB_PATH"

      - name: Analyze frontend
        working-directory: student-app
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        run: |
          set -e
          sonar-scanner \
            -Dsonar.projectKey=EduAdmin-Frontend \
            -Dsonar.projectName=EduAdmin-Frontend \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sources=src \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**"

      - name: Cleanup scanner files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sonar-scanner-extract"
          rm -f "$RUNNER_TEMP/sonar-scanner.zip"

  # 5. Login to Azure
  
  # Install Azure CLI, authenticate, and validate Azure/ACR.
  azure-login:
    name: Install Azure CLI and Validate Azure
    needs:
      - api-build-test
      - api-sonarqube
      - frontend-build
      - frontend-sonarqube
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI through pipeline
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v az >/dev/null 2>&1; then
            echo "Azure CLI not found. Installing..."

            sudo -n dnf install -y \
              https://packages.microsoft.com/config/rhel/8.0/packages-microsoft-prod.rpm

            sudo -n dnf install -y azure-cli
          else
            echo "Azure CLI is already installed."
          fi

          az version
          az --version

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate subscription and ACR
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "Missing GitHub secret: ACR_LOGIN_SERVER"
            exit 1
          fi

          az account show \
            --query '{subscription:name, subscriptionId:id, tenant:tenantId}' \
            --output table

          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"

          az acr show \
            --name "$ACR_NAME" \
            --query '{name:name, loginServer:loginServer}' \
            --output table

          echo "Azure CLI installation, login and ACR validation successful."

      - name: Azure logout
        if: always()
        run: az logout || true

  # Build and push the API image in one job.
  api-image:
    name: Build and Push API Image
    needs: azure-login
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: eduadmin-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI through pipeline
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v az >/dev/null 2>&1; then
            sudo -n dnf install -y \
              https://packages.microsoft.com/config/rhel/8.0/packages-microsoft-prod.rpm
            sudo -n dnf install -y azure-cli
          fi
          az version

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download published API artifact
        uses: actions/download-artifact@v4
        with:
          name: eduadmin-api-publish
          path: docker-context/api/publish

      - name: Prepare API Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          test -f StudentAPI/StudentAPI/StudentAPI/Dockerfile
          cp StudentAPI/StudentAPI/StudentAPI/Dockerfile \
            docker-context/api/Dockerfile
          test -n "$(find docker-context/api/publish -type f -print -quit)"

      - name: Build API image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            docker-context/api

      - name: Push API image to ACR
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr login --name "$ACR_NAME"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

      - name: Cleanup
        if: always()
        run: |
          docker logout "${ACR_LOGIN_SERVER:-invalid}" || true
          docker image rm \
            "${ACR_LOGIN_SERVER:-invalid}/${IMAGE_NAME:-eduadmin-api}:${GITHUB_SHA}" \
            || true
          rm -rf docker-context/api
          az logout || true

  # Frontend runs only after the API image has been pushed.
  frontend-image:
    name: Build and Push Frontend Image
    needs: api-image
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: eduadmin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI through pipeline
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v az >/dev/null 2>&1; then
            sudo -n dnf install -y \
              https://packages.microsoft.com/config/rhel/8.0/packages-microsoft-prod.rpm
            sudo -n dnf install -y azure-cli
          fi
          az version

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Angular build artifact
        uses: actions/download-artifact@v4
        with:
          name: eduadmin-frontend-dist
          path: docker-context/frontend/dist

      - name: Prepare frontend Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          test -f student-app/Dockerfile
          cp student-app/Dockerfile docker-context/frontend/Dockerfile
          test -n "$(find docker-context/frontend/dist -type f -print -quit)"

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            docker-context/frontend

      - name: Push frontend image to ACR
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr login --name "$ACR_NAME"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

      - name: Cleanup
        if: always()
        run: |
          docker logout "${ACR_LOGIN_SERVER:-invalid}" || true
          docker image rm \
            "${ACR_LOGIN_SERVER:-invalid}/${IMAGE_NAME:-eduadmin-frontend}:${GITHUB_SHA}" \
            || true
          rm -rf docker-context/frontend
          az logout || true
