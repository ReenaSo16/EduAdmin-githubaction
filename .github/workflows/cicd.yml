name: EduAdmin Build and SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '22'

jobs:
  build-api:
    name: Build, Test and Analyze .NET API
    runs-on: [self-hosted, Linux, X64, onprem-kubeadm-runner]

    defaults:
      run:
        shell: bash
        working-directory: StudentAPI/StudentAPI/StudentAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Verify .NET SDK
        run: |
          dotnet --info

      - name: Diagnose Runner and SonarQube Connectivity
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e

          echo "=== Runner diagnostics ==="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner architecture: ${RUNNER_ARCH:-unknown}"

          echo "=== Validate SonarQube secret ==="
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is missing."
            exit 1
          fi

          echo "SonarQube URL: $SONAR_HOST_URL"

          echo "=== Check TCP connectivity ==="
          nc -vz -w 10 104.211.220.200 9000

          echo "=== Check SonarQube status ==="
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

          echo
          echo "SonarQube connectivity check passed."

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/dotnet-tools"
          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"

      - name: Verify SonarScanner
        run: |
          dotnet-sonarscanner --version

      - name: Begin SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          set -e

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN_API secret is missing."
            exit 1
          fi

          dotnet-sonarscanner begin \
            /k:"EduAdmin" \
            /n:"EduAdmin" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Restore API dependencies
        run: |
          dotnet restore StudentAPI.csproj

      - name: Build API
        run: |
          dotnet build StudentAPI.csproj \
            --configuration Release \
            --no-restore

      - name: Test API
        run: |
          dotnet test StudentAPI.csproj \
            --configuration Release \
            --no-build

      - name: Complete SonarQube Analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          dotnet-sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

  build-frontend:
    name: Build Angular Frontend
    runs-on: [self-hosted, Linux, X64, onprem-kubeadm-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular frontend
        working-directory: student-app
        run: npm run build