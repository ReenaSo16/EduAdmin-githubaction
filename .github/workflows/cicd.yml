      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI if missing
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v az >/dev/null 2>&1; then
            echo "Azure CLI not found. Installing..."

            curl -fsSL https://aka.ms/InstallAzureCLIDeb \
              -o "$RUNNER_TEMP/install-azure-cli.sh"

            sudo bash "$RUNNER_TEMP/install-azure-cli.sh"
          else
            echo "Azure CLI is already installed."
          fi

          az version

      - name: Verify Docker
        run: docker version

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build API Docker image
        run: |
          docker build \
            -t "${ACR_LOGIN_SERVER}/studentapi:${IMAGE_TAG}" \
            -t "${ACR_LOGIN_SERVER}/studentapi:latest" \
            -f StudentAPI/StudentAPI/StudentAPI/Dockerfile \
            StudentAPI/StudentAPI/StudentAPI

      - name: Build Angular Docker image
        run: |
          docker build \
            -t "${ACR_LOGIN_SERVER}/studentapp:${IMAGE_TAG}" \
            -t "${ACR_LOGIN_SERVER}/studentapp:latest" \
            -f student-app/Dockerfile \
            student-app

      - name: Push API image
        run: |
          docker push "${ACR_LOGIN_SERVER}/studentapi:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/studentapi:latest"

      - name: Push Angular image
        run: |
          docker push "${ACR_LOGIN_SERVER}/studentapp:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/studentapp:latest"

      - name: Verify repositories in ACR
        run: |
          az acr repository list \
            --name "$ACR_NAME" \
            --output table

      - name: Azure Logout
        if: always()
        run: |
          if command -v az >/dev/null 2>&1; then
            az logout || true
          fi


  deploy-onprem:
    name: Deploy SQL Server, DACPAC and Application to on-prem Kubernetes
    runs-on: [self-hosted, Linux, X64]
    needs: build-and-push-acr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      NAMESPACE: student
      ACR_LOGIN_SERVER: reenaacr1.azurecr.io
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login for ACR credentials
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify on-prem Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          command -v kubectl
          kubectl version --client
          kubectl get nodes
          kubectl get namespace "$NAMESPACE" || kubectl create namespace "$NAMESPACE"

      - name: Create or update Kubernetes configuration and secrets
        shell: bash
        env:
          SQLSERVER_SA_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail

          test -n "$SQLSERVER_SA_PASSWORD"
          test -n "$AZURE_CREDENTIALS"

          # Use the same Service Principal stored in AZURE_CREDENTIALS.
          # Its client ID is the Docker username and client secret is the password.
          ACR_USERNAME="$(python3 -c 'import json,os; print(json.loads(os.environ["AZURE_CREDENTIALS"])["clientId"])')"
          ACR_PASSWORD="$(python3 -c 'import json,os; print(json.loads(os.environ["AZURE_CREDENTIALS"])["clientSecret"])')"
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

          kubectl apply -f k8s/configmap.yaml

          kubectl create secret docker-registry acr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username="$ACR_USERNAME" \
            --docker-password="$ACR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic sqlserver-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ACCEPT_EULA=Y \
            --from-literal=MSSQL_PID=Developer \
            --from-literal=MSSQL_SA_PASSWORD="$SQLSERVER_SA_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic student-db-secret \
            --namespace "$NAMESPACE" \
            --from-literal="ConnectionStrings__DefaultConnection=Server=sqlserver-service,1433;Database=StudentDB;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy SQL Server
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f k8s/sqlserver-pvc.yaml
          kubectl apply -f k8s/sqlserver-service.yaml
          kubectl apply -f k8s/sqlserver-deployment.yaml

          kubectl rollout status statefulset/sqlserver \
            --namespace "$NAMESPACE" \
            --timeout=10m

          kubectl get pods,pvc,service -n "$NAMESPACE"

      - name: Install .NET SDK for SqlPackage
        shell: bash