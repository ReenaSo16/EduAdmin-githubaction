name: EduAdmin Build and SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '22'

jobs:

  # Stage 1: Build and test .NET API
  build-api:
    name: Build and Test .NET API
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        shell: bash
        working-directory: StudentAPI/StudentAPI/StudentAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8 in runner workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
      - name: Verify .NET SDK
        run: |
          "$RUNNER_TEMP/dotnet/dotnet" --info
      - name: Restore dependencies
        run: dotnet restore StudentAPI.csproj

      - name: Build API
        run: dotnet build StudentAPI.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test StudentAPI.csproj --configuration Release --no-build

  # Stage 2: Build Angular frontend
  build-frontend:
    name: Build Angular Frontend
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular
        working-directory: student-app
        run: npm run build