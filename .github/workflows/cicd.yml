name: EduAdmin CI-CD - On-Prem Kubernetes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '22'
  ACR_NAME: reenaacr1
  ACR_LOGIN_SERVER: reenaacr1.azurecr.io
  API_DIR: StudentAPI/StudentAPI/StudentAPI
  FRONTEND_DIR: student-app
  NAMESPACE: student

jobs:
  # Stage 1: Build and test .NET API
  build-api:
    name: Build and Test .NET API
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate API project path
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          find . -maxdepth 6 -type f \( -name '*.csproj' -o -name '*.sln' \) -print
          test -f "$API_DIR/StudentAPI.csproj"

      - name: Install .NET 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Restore API dependencies
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: dotnet restore StudentAPI.csproj

      - name: Build API
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: dotnet build StudentAPI.csproj --configuration Release --no-restore

      - name: Test API
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: dotnet test StudentAPI.csproj --configuration Release

  # Stage 2: Build Angular frontend
  build-frontend:
    name: Build Angular Frontend
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate frontend path
        shell: bash
        run: |
          set -euo pipefail
          test -f "$FRONTEND_DIR/package.json" || {
            echo "package.json not found in $FRONTEND_DIR"
            find . -maxdepth 6 -name package.json -print
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular
        working-directory: student-app
        run: npm run build

  # Stage 3: SonarQube analysis for .NET API
  sonar-api:
    name: SonarQube API Analysis
    runs-on: [self-hosted, Linux, X64]
    needs: build-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/dotnet-tools"

      - name: Add SonarScanner to PATH
        run: echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"

      - name: Restore API dependencies
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: dotnet restore StudentAPI.csproj

      - name: Begin, build, and end SonarQube analysis
        working-directory: StudentAPI/StudentAPI/StudentAPI
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_TOKEN"
          dotnet sonarscanner begin \
            /k:"EduAdmin-API" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true
          dotnet build StudentAPI.csproj --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Stage 4: SonarQube analysis for Angular frontend
  sonar-frontend:
    name: SonarQube Frontend Analysis
    runs-on: [self-hosted, Linux, X64]
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular
        working-directory: student-app
        run: npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: student-app
          args: >
            -Dsonar.projectKey=EduAdmin-Frontend
            -Dsonar.projectName=EduAdmin-Frontend
            -Dsonar.qualitygate.wait=true

  # Stage 5: Gate - both SonarQube jobs must pass
  sonar-gate:
    name: SonarQube Pipeline Gate
    runs-on: [self-hosted, Linux, X64]
    needs:
      - sonar-api
      - sonar-frontend
    steps:
      - name: Confirm analyses and quality gates passed
        run: echo "Both SonarQube analyses and quality gates succeeded."

  # Stage 6: Publish build artifacts
  upload-artifacts:
    name: Upload Build Artifacts
    runs-on: [self-hosted, Linux, X64]
    needs: sonar-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --install-dir "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Publish API
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: dotnet publish StudentAPI.csproj --configuration Release --output "${{ github.workspace }}/artifacts/api"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Build Angular frontend
        working-directory: student-app
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Copy Angular build output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/frontend
          if [ -d "student-app/dist/student-app/browser" ]; then
            cp -r student-app/dist/student-app/browser/. artifacts/frontend/
          elif [ -d "student-app/dist" ]; then
            cp -r student-app/dist/. artifacts/frontend/
          else
            echo "Angular dist output not found; check angular.json outputPath."
            exit 1
          fi

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-api
          path: artifacts/api/
          retention-days: 7
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-frontend
          path: artifacts/frontend/
          retention-days: 7
          if-no-files-found: error

  # Stage 7: Build and push Docker images to ACR
  build-and-push-acr:
    name: Build and Push Docker Images to ACR
    runs-on: [self-hosted, Linux, X64]
    needs: upload-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker and Azure CLI
        run: |
          set -euo pipefail
          docker version
          az version

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build API Docker image
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/studentapi:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/studentapi:latest" \
            -f StudentAPI/StudentAPI/StudentAPI/Dockerfile \
            StudentAPI/StudentAPI/StudentAPI

      - name: Build Angular Docker image
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/studentapp:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/studentapp:latest" \
            -f student-app/Dockerfile \
            student-app

      - name: Push images
        run: |
          set -euo pipefail
          docker push "$ACR_LOGIN_SERVER/studentapi:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/studentapi:latest"
          docker push "$ACR_LOGIN_SERVER/studentapp:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/studentapp:latest"

      - name: Verify ACR repositories
        run: az acr repository list --name "$ACR_NAME" --output table

      - name: Azure Logout
        if: always()
        run: az logout || true

  # Stage 8: Deploy applications to existing on-prem Kubernetes.
  # SQL Server stays on Windows at 192.168.1.124:1433.
  deploy-onprem:
    name: Deploy Application to On-Prem Kubernetes
    runs-on: [self-hosted, Linux, X64]
    needs: build-and-push-acr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl get nodes
          kubectl get namespace "$NAMESPACE" || kubectl create namespace "$NAMESPACE"

      - name: Configure ConfigMap and database Secret
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SQLSERVER_USERNAME"
          test -n "$SQLSERVER_PASSWORD"

          kubectl apply -f k8s/configmap.yaml --namespace "$NAMESPACE"

          CONNECTION_STRING="Server=192.168.1.124,1433;Database=StudentDB;User Id=${SQLSERVER_USERNAME};Password=${SQLSERVER_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"

          kubectl create secret generic student-db-secret \
            --namespace "$NAMESPACE" \
            --from-literal="ConnectionStrings__DefaultConnection=$CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure ACR pull Secret
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

          kubectl create secret docker-registry acr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username="$ACR_USERNAME" \
            --docker-password="$ACR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy API
        run: |
          set -euo pipefail
          kubectl apply -f k8s/studentapi-service.yaml --namespace "$NAMESPACE"
          kubectl apply -f k8s/studentapi-deployment.yaml --namespace "$NAMESPACE"

          kubectl patch deployment studentapi --namespace "$NAMESPACE" --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"acr-pull-secret"}]}}}}'

          kubectl set image deployment/studentapi \
            studentapi="$ACR_LOGIN_SERVER/studentapi:$IMAGE_TAG" \
            --namespace "$NAMESPACE"

          kubectl rollout status deployment/studentapi \
            --namespace "$NAMESPACE" --timeout=5m

      - name: Deploy Angular frontend
        run: |
          set -euo pipefail
          kubectl apply -f k8s/studentapp-service.yaml --namespace "$NAMESPACE"
          kubectl apply -f k8s/studentapp-deployment.yaml --namespace "$NAMESPACE"

          kubectl patch deployment studentapp --namespace "$NAMESPACE" --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"acr-pull-secret"}]}}}}'

          kubectl set image deployment/studentapp \
            studentapp="$ACR_LOGIN_SERVER/studentapp:$IMAGE_TAG" \
            --namespace "$NAMESPACE"

          kubectl rollout status deployment/studentapp \
            --namespace "$NAMESPACE" --timeout=5m

      - name: Verify deployment
        run: |
          set -euo pipefail
          kubectl get pods,services -n "$NAMESPACE"
          kubectl get deployments -n "$NAMESPACE"
