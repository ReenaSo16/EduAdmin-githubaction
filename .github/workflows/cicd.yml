
name: EduAdmin Build, SonarQube, Artifacts and ACR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '22'
  ACR_NAME: reenaacr1
  ACR_LOGIN_SERVER: reenaacr1.azurecr.io

jobs:

  # Stage 1: Build and test .NET API
  build-api:
    name: Build and Test .NET API
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        shell: bash
        working-directory: StudentAPI/StudentAPI/StudentAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"

          curl -fsSL https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"

          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Verify .NET SDK
        run: "$RUNNER_TEMP/dotnet/dotnet" --info

      - name: Restore dependencies
        run: dotnet restore StudentAPI.csproj

      - name: Build API
        run: dotnet build StudentAPI.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test StudentAPI.csproj --configuration Release


  # Stage 2: Build Angular frontend
  build-frontend:
    name: Build Angular Frontend
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular
        working-directory: student-app
        run: npm run build


  # Stage 3: SonarQube analysis for .NET API
  sonar-api:
    name: SonarQube API Analysis
    runs-on: [self-hosted, Linux, X64]
    needs: build-api

    defaults:
      run:
        shell: bash
        working-directory: StudentAPI/StudentAPI/StudentAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"

          curl -fsSL https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"

          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Install SonarScanner for .NET
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet-tools"

          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/dotnet-tools"

          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: dotnet restore StudentAPI.csproj

      - name: Begin SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          dotnet sonarscanner begin \
            /k:"EduAdmin-API" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true

      - name: Build for SonarQube
        run: dotnet build StudentAPI.csproj --configuration Release

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"


  # Stage 4: SonarQube analysis for Angular
  sonar-frontend:
    name: SonarQube Frontend Analysis
    runs-on: [self-hosted, Linux, X64]
    needs: build-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install dependencies
        working-directory: student-app
        run: npm ci

      - name: Build Angular
        working-directory: student-app
        run: npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: student-app
          args: >
            -Dsonar.projectKey=EduAdmin-Frontend
            -Dsonar.projectName=EduAdmin-Frontend
            -Dsonar.qualitygate.wait=true


  # Stage 5: Wait for both SonarQube jobs
  sonar-gate:
    name: SonarQube Pipeline Gate
    runs-on: [self-hosted, Linux, X64]
    needs:
      - sonar-api
      - sonar-frontend

    steps:
      - name: Confirm analysis succeeded
        run: echo "Both builds and SonarQube analyses succeeded."


  # Stage 6: Publish build artifacts to GitHub Actions
  upload-artifacts:
    name: Upload Build Artifacts to GitHub
    runs-on: [self-hosted, Linux, X64]
    needs: sonar-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"

          curl -fsSL https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$RUNNER_TEMP/dotnet"

          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Publish .NET API
        working-directory: StudentAPI/StudentAPI/StudentAPI
        run: |
          dotnet restore StudentAPI.csproj

          dotnet publish StudentAPI.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/artifacts/api"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Build Angular frontend
        working-directory: student-app
        run: |
          npm ci
          npm run build

      - name: Copy Angular build output
        run: |
          mkdir -p artifacts/frontend
          cp -r student-app/dist/student-app/browser/. artifacts/frontend/

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-api
          path: artifacts/api/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduadmin-frontend
          path: artifacts/frontend/
          retention-days: 7
          if-no-files-found: error


  # Stage 7: Install Azure CLI, login and push Docker images to ACR
  build-and-push-acr:
    name: Build and Push Docker Images to ACR
    runs-on: [self-hosted, Linux, X64]
    needs: upload-artifacts

    # Run this job only for a push to main, not for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI if missing
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v az >/dev/null 2>&1; then
            echo "Azure CLI not found. Installing..."

            curl -fsSL https://aka.ms/InstallAzureCLIDeb \
              -o "$RUNNER_TEMP/install-azure-cli.sh"

            sudo bash "$RUNNER_TEMP/install-azure-cli.sh"
          else
            echo "Azure CLI is already installed."
          fi

          az version

      - name: Verify Docker
        run: docker version

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build API Docker image
        run: |
          docker build \
            -t "${ACR_LOGIN_SERVER}/studentapi:${IMAGE_TAG}" \
            -t "${ACR_LOGIN_SERVER}/studentapi:latest" \
            -f StudentAPI/StudentAPI/StudentAPI/Dockerfile \
            StudentAPI/StudentAPI/StudentAPI

      - name: Build Angular Docker image
        run: |
          docker build \
            -t "${ACR_LOGIN_SERVER}/studentapp:${IMAGE_TAG}" \
            -t "${ACR_LOGIN_SERVER}/studentapp:latest" \
            -f student-app/Dockerfile \
            student-app

      - name: Push API image
        run: |
          docker push "${ACR_LOGIN_SERVER}/studentapi:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/studentapi:latest"

      - name: Push Angular image
        run: |
          docker push "${ACR_LOGIN_SERVER}/studentapp:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/studentapp:latest"

      - name: Verify repositories in ACR
        run: |
          az acr repository list \
            --name "$ACR_NAME" \
            --output table

      - name: Azure Logout
        if: always()
        run: |
          if command -v az >/dev/null 2>&1; then
            az logout || true
          fi
