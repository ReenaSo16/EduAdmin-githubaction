
name: EduAdmin CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAMESPACE: student
  ACR_NAME: reenaacr1
  ACR_LOGIN_SERVER: reenaacr1.azurecr.io
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:

  # 1. Build and test API
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studentapi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release

  # 2. Build Angular frontend
  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studentapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: studentapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

  # 3. Build and push images to ACR
  build-and-push-acr:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push API image
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/studentapi:$GITHUB_SHA" \
            -f studentapi/Dockerfile studentapi
          docker push "$ACR_LOGIN_SERVER/studentapi:$GITHUB_SHA"

      - name: Build and push frontend image
        run: |
          set -euo pipefail
          docker build \
            -t "$ACR_LOGIN_SERVER/studentapp:$GITHUB_SHA" \
            -f studentapp/Dockerfile studentapp
          docker push "$ACR_LOGIN_SERVER/studentapp:$GITHUB_SHA"

  # 4. Deploy to on-prem Kubernetes
  deploy-onprem:
    name: Deploy to On-Prem Kubernetes
    runs-on: [self-hosted, Linux, X64]
    needs: build-and-push-acr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes
        run: |
          set -euo pipefail
          kubectl get nodes
          kubectl get namespace "$NAMESPACE" \
            || kubectl create namespace "$NAMESPACE"

      - name: Apply ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml \
            --namespace "$NAMESPACE"

      # Credentials are stored in GitHub Actions Secrets.
      - name: Create or update database Secret
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SQLSERVER_USERNAME"
          test -n "$SQLSERVER_PASSWORD"

          CONNECTION_STRING="Server=192.168.1.124,1433;Database=StudentDB;User Id=${SQLSERVER_USERNAME};Password=${SQLSERVER_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"

          kubectl create secret generic student-db-secret \
            --namespace "$NAMESPACE" \
            --from-literal="ConnectionStrings__DefaultConnection=$CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Use dedicated ACR credentials, stored as GitHub Secrets.
      - name: Create or update ACR pull Secret
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

          kubectl create secret docker-registry acr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username="$ACR_USERNAME" \
            --docker-password="$ACR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy API
        run: |
          set -euo pipefail

          kubectl apply -f k8s/studentapi-service.yaml \
            --namespace "$NAMESPACE"
          kubectl apply -f k8s/studentapi-deployment.yaml \
            --namespace "$NAMESPACE"

          kubectl patch deployment studentapi \
            --namespace "$NAMESPACE" \
            --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"acr-pull-secret"}]}}}}'

          kubectl set image deployment/studentapi \
            studentapi="$ACR_LOGIN_SERVER/studentapi:$GITHUB_SHA" \
            --namespace "$NAMESPACE"

          kubectl rollout status deployment/studentapi \
            --namespace "$NAMESPACE" --timeout=5m

      - name: Deploy Angular frontend
        run: |
          set -euo pipefail

          kubectl apply -f k8s/studentapp-service.yaml \
            --namespace "$NAMESPACE"
          kubectl apply -f k8s/studentapp-deployment.yaml \
            --namespace "$NAMESPACE"

          kubectl patch deployment studentapp \
            --namespace "$NAMESPACE" \
            --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"acr-pull-secret"}]}}}}'

          kubectl set image deployment/studentapp \
            studentapp="$ACR_LOGIN_SERVER/studentapp:$GITHUB_SHA" \
            --namespace "$NAMESPACE"

          kubectl rollout status deployment/studentapp \
            --namespace "$NAMESPACE" --timeout=5m

      - name: Verify deployment
        run: |
          set -euo pipefail
          kubectl get pods,services -n "$NAMESPACE"
          kubectl get deployments -n "$NAMESPACE"
