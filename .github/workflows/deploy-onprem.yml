name: EduAdmin CD - On-Prem Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character SHA from a successful CI run"
        required: true
        type: string

      deploy_database:
        description: "Deploy StudentDB DACPAC? Enable only for database schema changes."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eduadmin-onprem-cd
  cancel-in-progress: false

env:
  K8S_NAMESPACE: student
  SQL_DATABASE: StudentDB
  SQL_SERVER: "192.168.159.1,1433"

jobs:

  # ==========================================
  # JOB 1: Deploy Database DACPAC (Optional)
  # ==========================================
  deploy-database:
    name: Deploy StudentDB DACPAC
    if: ${{ inputs.deploy_database }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate input and DACPAC
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid 40-character commit SHA."
            exit 1
          fi

          test -s Database/StudentDB.dacpac
          echo "DACPAC file found."

      - name: Install .NET SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.dotnet"

          curl -fsSL --retry 3 \
            https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$HOME/.dotnet"

          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

          "$HOME/.dotnet/dotnet" --info

      - name: Install SqlPackage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sqlpackage"

          "$HOME/.dotnet/dotnet" tool install \
            --tool-path "$RUNNER_TEMP/sqlpackage" \
            Microsoft.SqlPackage

          echo "$RUNNER_TEMP/sqlpackage" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/sqlpackage/sqlpackage" /Version

      - name: Validate SQL credentials
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SQLSERVER_USERNAME"
          test -n "$SQLSERVER_PASSWORD"

          echo "SQL credentials configured."

      - name: Check SQL Server connectivity
        shell: bash
        run: |
          set -euo pipefail

          timeout 10 bash -c '</dev/tcp/192.168.159.1/1433'

          echo "SQL Server connectivity successful."

      - name: Generate DACPAC deployment report
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          "$RUNNER_TEMP/sqlpackage/sqlpackage" \
            /Action:DeployReport \
            /SourceFile:"Database/StudentDB.dacpac" \
            /TargetServerName:"$SQL_SERVER" \
            /TargetDatabaseName:"$SQL_DATABASE" \
            /TargetUser:"$SQLSERVER_USERNAME" \
            /TargetPassword:"$SQLSERVER_PASSWORD" \
            /TargetEncryptConnection:True \
            /TargetTrustServerCertificate:True \
            /OutputPath:"$RUNNER_TEMP/StudentDB-deploy-report.xml"

          test -s "$RUNNER_TEMP/StudentDB-deploy-report.xml"

          echo "DACPAC deployment report generated."

      - name: Publish DACPAC
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          "$RUNNER_TEMP/sqlpackage/sqlpackage" \
            /Action:Publish \
            /SourceFile:"Database/StudentDB.dacpac" \
            /TargetServerName:"$SQL_SERVER" \
            /TargetDatabaseName:"$SQL_DATABASE" \
            /TargetUser:"$SQLSERVER_USERNAME" \
            /TargetPassword:"$SQLSERVER_PASSWORD" \
            /TargetEncryptConnection:True \
            /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True

          echo "DACPAC publish completed."

  # ==========================================
  # JOB 2: Deploy API and Frontend using Helm
  # Runs when database job succeeds OR is skipped
  # ==========================================
  deploy-kubernetes:
    name: Deploy API and Frontend using Helm
    needs: deploy-database

    if: >-
      ${{
        always() &&
        (
          needs.deploy-database.result == 'success' ||
          needs.deploy-database.result == 'skipped'
        )
      }}

    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # ----------------------------------------
      # Validate SHA and tools
      # ----------------------------------------
      - name: Validate tools and image SHA
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid image SHA."
            exit 1
          fi

          command -v kubectl
          command -v helm
          command -v curl
          command -v jq

          test -s helm/eduadmin/Chart.yaml
          test -s helm/eduadmin/values.yaml

          echo "Tools and Helm chart validated."

      # ----------------------------------------
      # Verify both public Docker Hub images
      # ----------------------------------------
      - name: Verify Docker Hub images
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          verify_image() {
            local repository="$1"

            echo "Checking $repository:$IMAGE_TAG"

            local token
            token=$(curl -fsSL --retry 3 \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repository}:pull" \
              | jq -er '.token')

            local status
            status=$(curl -sSL --retry 3 \
              -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/${repository}/manifests/${IMAGE_TAG}")

            if [[ "$status" != "200" ]]; then
              echo "ERROR: Image not found or inaccessible."
              echo "Repository: $repository"
              echo "HTTP status: $status"
              return 1
            fi

            echo "Image exists: $repository:$IMAGE_TAG"
          }

          verify_image "reenaso16/eduadmin-api"
          verify_image "reenaso16/eduadmin-frontend"

          echo "Both Docker Hub images verified."

      # ----------------------------------------
      # Validate and render Helm 
      # ----------------------------------------
      - name: Validate Helm chart
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          helm lint ./helm/eduadmin

          helm template eduadmin ./helm/eduadmin \
            --namespace "$K8S_NAMESPACE" \
            --set-string api.image.tag="$IMAGE_TAG" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            > "$RUNNER_TEMP/eduadmin-rendered.yaml"

          grep -Fq "reenaso16/eduadmin-api:$IMAGE_TAG" \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"

          grep -Fq "reenaso16/eduadmin-frontend:$IMAGE_TAG" \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"

          if grep -Eq 'reenaacr1\.azurecr\.io|acr-pull-secret|imagePullSecrets' \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"; then
            echo "ERROR: Old ACR or imagePullSecrets configuration found."
            exit 1
          fi

          echo "Helm validation successful."

      # ----------------------------------------
      # Check Kubernetes access
      # ----------------------------------------
      - name: Check Kubernetes connection
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes
          kubectl get namespace "$K8S_NAMESPACE"

      # ----------------------------------------
      # Apply ConfigMap
      # ----------------------------------------
      - name: Apply ConfigMap
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f k8s/configmap.yaml

      # ----------------------------------------
      # Create or update database Secret
      # ----------------------------------------
      - name: Create or update database Secret
        shell: bash
        env:
          STUDENT_DB_CONNECTION: ${{ secrets.STUDENT_DB_CONNECTION }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          if [[ -z "$STUDENT_DB_CONNECTION" ]]; then
            echo "ERROR: STUDENT_DB_CONNECTION secret is missing."
            exit 1
          fi

          kubectl create secret generic eduadmin-db-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal="ConnectionStrings__DefaultConnection=$STUDENT_DB_CONNECTION" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Database Secret created or updated."

      # ----------------------------------------
      # Deploy using Helm
      # ----------------------------------------
      - name: Deploy application using Helm
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          echo "Deploying EduAdmin using Docker Hub images."
          echo "Image tag: $IMAGE_TAG"

          helm upgrade --install eduadmin ./helm/eduadmin \
            --namespace "$K8S_NAMESPACE" \
            --set-string api.image.tag="$IMAGE_TAG" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 30m

          echo "Helm deployment completed."

      # ----------------------------------------
      # Wait for application rollouts
      # ----------------------------------------
      - name: Wait for rollouts
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/studentapi \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/studentapp \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

          echo "Both application rollouts successful."

      # ----------------------------------------
      # Verify deployed resources and image tags
      # ----------------------------------------
      - name: Verify deployed resources
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          API_IMAGE=$(kubectl get deployment studentapi \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="studentapi")].image}')

          FRONTEND_IMAGE=$(kubectl get deployment studentapp \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="studentapp")].image}')

          EXPECTED_API_IMAGE="reenaso16/eduadmin-api:$IMAGE_TAG"
          EXPECTED_FRONTEND_IMAGE="reenaso16/eduadmin-frontend:$IMAGE_TAG"

          if [[ "$API_IMAGE" != "$EXPECTED_API_IMAGE" ]]; then
            echo "ERROR: API image mismatch."
            echo "Expected: $EXPECTED_API_IMAGE"
            echo "Actual: $API_IMAGE"
            exit 1
          fi

          if [[ "$FRONTEND_IMAGE" != "$EXPECTED_FRONTEND_IMAGE" ]]; then
            echo "ERROR: Frontend image mismatch."
            echo "Expected: $EXPECTED_FRONTEND_IMAGE"
            echo "Actual: $FRONTEND_IMAGE"
            exit 1
          fi

          kubectl get configmap eduadmin-config -n "$K8S_NAMESPACE"
          kubectl get secret eduadmin-db-secret -n "$K8S_NAMESPACE"

          kubectl get deployments,pods,services \
            -n "$K8S_NAMESPACE" -o wide

          helm status eduadmin -n "$K8S_NAMESPACE"

          kubectl get events -n "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp | tail -n 20

          echo "API image: $API_IMAGE"
          echo "Frontend image: $FRONTEND_IMAGE"
          echo "Deployment verification successful."

      # ----------------------------------------
      # Diagnostics on failure
      # ----------------------------------------
      - name: Diagnostics on deployment failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "Deployment diagnostics..."

          kubectl get deployments,pods,services \
            -n "$K8S_NAMESPACE" -o wide || true

          kubectl get events -n "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp | tail -n 40 || true

          kubectl describe deployment studentapi \
            -n "$K8S_NAMESPACE" || true

          kubectl describe deployment studentapp \
            -n "$K8S_NAMESPACE" || true

          echo "API pod logs:"
          kubectl logs -n "$K8S_NAMESPACE" \
            -l app=studentapi --all-containers=true --tail=100 || true

          echo "Frontend pod logs:"
          kubectl logs -n "$K8S_NAMESPACE" \
            -l app=studentapp --all-containers=true --tail=100 || true

          echo "Helm release status:"
          helm status eduadmin -n "$K8S_NAMESPACE" || true
