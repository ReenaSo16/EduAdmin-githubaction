name: EduAdmin CD - GitOps Argo CD

# CD is triggered manually. CI.yml remains unchanged.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character Docker image SHA"
        required: true
        type: string

      deploy_database:
        description: "Deploy StudentDB DACPAC? Select only for DB changes."
        required: true
        type: boolean
        default: false

# Required because this workflow commits Helm values back to GitHub.
permissions:
  contents: write

# Prevent two CD runs from updating the same values file simultaneously.
concurrency:
  group: eduadmin-gitops-cd
  cancel-in-progress: false

env:
  K8S_NAMESPACE: student
  SQL_DATABASE: StudentDB
  SQL_SERVER: "192.168.159.1,1433"

jobs:

  # ==========================================================
  # JOB 1: OPTIONAL DATABASE DEPLOYMENT
  # This job is skipped when deploy_database is false.
  # Database schema changes are intentionally separate from
  # the Argo CD application deployment.
  # ==========================================================
  deploy-database:
    name: Deploy StudentDB DACPAC
    if: ${{ inputs.deploy_database == true }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate SHA and DACPAC
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid image SHA."
            exit 1
          fi

          test -s Database/StudentDB.dacpac
          echo "DACPAC found."

      - name: Install .NET SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.dotnet"

          curl -fsSL --retry 3 \
            https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"

          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --channel 8.0 \
            --install-dir "$HOME/.dotnet"

          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

          "$HOME/.dotnet/dotnet" --info

      - name: Install SqlPackage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sqlpackage"

          "$HOME/.dotnet/dotnet" tool install \
            --tool-path "$RUNNER_TEMP/sqlpackage" \
            Microsoft.SqlPackage

          echo "$RUNNER_TEMP/sqlpackage" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/sqlpackage/sqlpackage" /Version

      - name: Validate SQL credentials
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SQLSERVER_USERNAME"
          test -n "$SQLSERVER_PASSWORD"

          echo "SQL credentials configured."

      - name: Check SQL Server connectivity
        shell: bash
        run: |
          set -euo pipefail

          timeout 10 bash -c '</dev/tcp/192.168.159.1/1433'

          echo "SQL Server connectivity successful."

      - name: Generate DACPAC deployment report
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          "$RUNNER_TEMP/sqlpackage/sqlpackage" \
            /Action:DeployReport \
            /SourceFile:"Database/StudentDB.dacpac" \
            /TargetServerName:"$SQL_SERVER" \
            /TargetDatabaseName:"$SQL_DATABASE" \
            /TargetUser:"$SQLSERVER_USERNAME" \
            /TargetPassword:"$SQLSERVER_PASSWORD" \
            /TargetEncryptConnection:True \
            /TargetTrustServerCertificate:True \
            /OutputPath:"$RUNNER_TEMP/StudentDB-deploy-report.xml"

          test -s "$RUNNER_TEMP/StudentDB-deploy-report.xml"

          echo "DACPAC report generated."

      - name: Publish DACPAC
        shell: bash
        env:
          SQLSERVER_USERNAME: ${{ secrets.SQLSERVER_USERNAME }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          "$RUNNER_TEMP/sqlpackage/sqlpackage" \
            /Action:Publish \
            /SourceFile:"Database/StudentDB.dacpac" \
            /TargetServerName:"$SQL_SERVER" \
            /TargetDatabaseName:"$SQL_DATABASE" \
            /TargetUser:"$SQLSERVER_USERNAME" \
            /TargetPassword:"$SQLSERVER_PASSWORD" \
            /TargetEncryptConnection:True \
            /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True

          echo "DACPAC publish completed."

  # ==========================================================
  # JOB 2: GITOPS CD
  #
  # No direct kubectl apply or helm upgrade.
  # This job updates Git. Argo CD performs deployment.
  # ==========================================================
  gitops-deploy:
    name: Update Helm Values for Argo CD
    needs: deploy-database

    # Run when optional DB job succeeded or was skipped.
    # Never update application images if DB deployment failed.
    if: >-
      ${{
        always() &&
        (
          needs.deploy-database.result == 'success' ||
          needs.deploy-database.result == 'skipped'
        )
      }}

    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      # Validate input before changing repository content.
      - name: Validate image SHA and tools
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Expected a 40-character lowercase SHA."
            exit 1
          fi

          command -v curl
          command -v jq
          command -v helm
          command -v python3
          command -v git

          test -s helm/eduadmin/Chart.yaml
          test -s helm/eduadmin/values.yaml

          echo "Input and tools validated."

      # Check both Docker Hub tags before committing a deployment.
      # This prevents Argo CD from deploying nonexistent images.
      - name: Verify Docker Hub images
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          verify_image() {
            local repository="$1"
            local token
            local status

            echo "Checking $repository:$IMAGE_TAG"

            token=$(curl -fsSL --retry 3 \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repository}:pull" \
              | jq -er '.token')

            status=$(curl -sSL --retry 3 \
              -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/${repository}/manifests/${IMAGE_TAG}")

            if [[ "$status" != "200" ]]; then
              echo "ERROR: Image verification failed."
              echo "Repository: $repository"
              echo "HTTP status: $status"
              return 1
            fi

            echo "Image verified: $repository:$IMAGE_TAG"
          }

          verify_image "reenaso16/eduadmin-api"
          verify_image "reenaso16/eduadmin-frontend"

      # Update only the two image tags.
      # Python standard library is used so no extra YAML package
      # needs to be installed on the self-hosted runner.
      #
      # The script requires the expected Helm values structure and
      # refuses to proceed if either image tag cannot be located.
      - name: Update Helm values.yaml
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/eduadmin/values.yaml")
          tag = os.environ["IMAGE_TAG"]
          content = path.read_text()

          # Match the image tag within the correct top-level section.
          # This avoids changing unrelated YAML fields.
          for section in ("api", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\n"
                  rf"(?:(?!^[^\s#]).*\n)*?"
                  rf"  image:\n"
                  rf"(?:(?!^  [^\s#]).*\n)*?"
                  rf"    tag:\s*)[^\n#]+"
              )

              updated, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + f'"{tag}"',
                  content,
                  count=1,
              )

              if count != 1:
                  raise RuntimeError(
                      f"Cannot locate {section}.image.tag"
                  )

              content = updated

          path.write_text(content)
          print("Updated API and frontend image tags.")
          PY

          git diff -- helm/eduadmin/values.yaml

      # Render the updated chart before pushing the change.
      # Argo CD will use the same chart and values from Git.
      - name: Validate Helm chart
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          helm lint ./helm/eduadmin

          helm template eduadmin ./helm/eduadmin \
            --namespace "$K8S_NAMESPACE" \
            > "$RUNNER_TEMP/eduadmin-rendered.yaml"

          grep -Fq "reenaso16/eduadmin-api:$IMAGE_TAG" \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"

          grep -Fq "reenaso16/eduadmin-frontend:$IMAGE_TAG" \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"

          if grep -Eq 'reenaacr1\.azurecr\.io|acr-pull-secret|imagePullSecrets' \
            "$RUNNER_TEMP/eduadmin-rendered.yaml"; then
            echo "ERROR: Unexpected old ACR configuration."
            exit 1
          fi

          echo "Helm validation successful."

      # Commit only values.yaml, never secrets or generated files.
      # If the tags are already correct, avoid an empty commit.
      - name: Commit and push GitOps changes
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/eduadmin/values.yaml

          if git diff --cached --quiet; then
            echo "No changes required. Images already configured."
            exit 0
          fi

          git commit -m "gitops: deploy EduAdmin $IMAGE_TAG"

          # Fail rather than force-push if main changed during the run.
          # This protects concurrent repository changes.
          git push origin HEAD:main

          echo "Helm values pushed successfully."

      - name: GitOps deployment summary
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          echo "=================================="
          echo "EduAdmin GitOps CD completed"
          echo "=================================="
          echo "API image: reenaso16/eduadmin-api:$IMAGE_TAG"
          echo "Frontend image: reenaso16/eduadmin-frontend:$IMAGE_TAG"
          echo "Git branch: main"
          echo "Helm path: helm/eduadmin"
          echo "Argo CD application: eduadmin"
          echo "Kubernetes namespace: student"
          echo ""
          echo "Argo CD will reconcile the desired Git state."
          echo "Check Argo CD UI for actual deployment health."
