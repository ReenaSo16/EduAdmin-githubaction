
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eduadmin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ReenaSo16/EduAdmin.git
    targetRevision: main
    path: helm/eduadmin
    helm:
      releaseName: eduadmin
  destination:
    server: https://kubernetes.default.svc
    namespace: student
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
