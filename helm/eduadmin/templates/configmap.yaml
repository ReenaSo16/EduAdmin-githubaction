
apiVersion: v1
kind: ConfigMap
metadata:
  name: eduadmin-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eduadmin
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DB_NAME: {{ .Values.configMap.DB_NAME | quote }}
  DB_PORT: {{ .Values.configMap.DB_PORT | quote }}
  ASPNETCORE_ENVIRONMENT: {{ .Values.configMap.ASPNETCORE_ENVIRONMENT | quote }}
