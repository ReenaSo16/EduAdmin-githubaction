
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapi
  namespace: {{ .Values.namespace }}
  labels:
    app: studentapi
    app.kubernetes.io/name: studentapi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}

spec:
  replicas: {{ .Values.api.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: studentapi

  template:
    metadata:
      labels:
        app: studentapi

    spec:
      containers:
        - name: studentapi
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}

          envFrom:
            - configMapRef:
                name: {{ .Values.api.configMapName }}

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: {{ .Values.api.secretKey }}

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
