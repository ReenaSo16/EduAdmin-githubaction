
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapi
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.api.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: studentapi

  template:
    metadata:
      labels:
        app: studentapi

    spec:
      imagePullSecrets:
        - name: acr-pull-secret

      containers:
        - name: studentapi
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}

          envFrom:
            - configMapRef:
                name: eduadmin-config

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: eduadmin-db-secret
                  key: ConnectionStrings__DefaultConnection

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
