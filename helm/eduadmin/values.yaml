
namespace: student

# Docker Hub repositories are public, so no imagePullSecret is required.
# imagePullSecret: acr-pull-secret

api:
  replicaCount: 1

  image:
    repository: reenaso16/eduadmin-api
    tag: "a3661e4984bbea3794af378f122294acaee62bdf"
    pullPolicy: Always

  containerPort: 5000

  service:
    name: studentapi-service
    type: NodePort
    port: 5000
    targetPort: 5000
    nodePort: 30081

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  configMapName: eduadmin-config
  secretName: eduadmin-db-secret
  secretKey: ConnectionStrings__DefaultConnection

frontend:
  replicaCount: 1

  image:
    repository: reenaso16/eduadmin-frontend
    tag: "a3661e4984bbea3794af378f122294acaee62bdf"
    pullPolicy: Always

  containerPort: 80

  service:
    name: studentapp-service
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

configMap:
  DB_NAME: "StudentDB"
  DB_PORT: "1433"
  ASPNETCORE_ENVIRONMENT: "Production"    
