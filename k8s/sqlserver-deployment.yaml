apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: student
spec:
  serviceName: sqlserver-service
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: sqlserver
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: ACCEPT_EULA
            - name: MSSQL_PID
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: MSSQL_PID
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-pvc