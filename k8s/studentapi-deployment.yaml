
apiVersion: apps/v1
kind: Deployment

metadata:
  name: studentapi
  namespace: student

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: studentapi

  template:
    metadata:
      labels:
        app: studentapi

    spec:
      containers:
        - name: studentapi
          image: reenaso16/eduadmin-api:a3661e4984bbea3794af378f122294acaee62bdf
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: eduadmin-config

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: eduadmin-db-secret
                  key: ConnectionStrings__DefaultConnection

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
