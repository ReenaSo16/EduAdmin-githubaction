# 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapi
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentapi
  template:
    metadata:
      labels:
        app: studentapi
    spec:
      containers:
        - name: studentapi
          image: reenaacr1.azurecr.io/studentapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: student-config
          env:
            - name: DB_SERVER
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: DB_SERVER
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: DB_PASSWORD
