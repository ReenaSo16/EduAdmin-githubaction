apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      containers:
        - name: studentapp
          image: reenaacr1.azurecr.io/studentapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
